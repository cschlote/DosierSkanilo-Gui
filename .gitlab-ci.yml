variables:
  VA_TEST: "gui"

default:
  image: "alpine:3.20"
  tags:
    - gitlabdocker
    - ryzen
  before_script:
    - command -v image-info.sh && image-info.sh || true

stages:
  - lint
  - build
  - test
  - release

lint:
  stage: lint
  before_script:
    - sh ./scripts/install-dependencies.sh lint
  script:
    - ./scripts/lint.sh
  cache:
    key: "DUB-CACHE"
    untracked: true
    paths:
      - .dub/

build:
  stage: build
  before_script:
    - sh ./scripts/install-dependencies.sh build
  script:
    - ldc2 --version
    - dub --version
    - ./scripts/build.sh
  artifacts:
    expire_in: 1 week
    paths:
      - build/bin/dosierskanilo-gui

test:
  stage: test
  before_script:
    - sh ./scripts/install-dependencies.sh build
  script:
    - ./scripts/test.sh
  coverage: '/\[coverage\] TOTAL [0-9]+\/[0-9]+ \(([0-9]+(?:\.[0-9]+)?)%\)/'
  artifacts:
    expire_in: 1 week
    paths:
      - build/coverage/

publish_release_assets:
  stage: release
  image: "alpine:3.20"
  needs:
    - job: build
      artifacts: true
  before_script:
    - apk add --no-cache bash curl tar
  script:
    - PACKAGE_NAME="dosierskanilo-gui"
    - ASSET_FILE="dosierskanilo-gui-${CI_COMMIT_TAG}-linux-x86_64-alpine.tar.gz"
    - mkdir -p build/release
    - tar -C build/bin -czf "build/release/${ASSET_FILE}" dosierskanilo-gui
    - PACKAGE_URL="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${PACKAGE_NAME}/${CI_COMMIT_TAG}/${ASSET_FILE}"
    - 'curl --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file "build/release/${ASSET_FILE}" "${PACKAGE_URL}"'
    - echo "RELEASE_ASSET_ALPINE_URL=${PACKAGE_URL}" > build/release/release.env
    - echo "RELEASE_ASSET_ALPINE_NAME=${ASSET_FILE}" >> build/release/release.env
  artifacts:
    expire_in: 1 week
    paths:
      - build/release/
    reports:
      dotenv: build/release/release.env
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
      when: on_success
    - when: never

create_gitlab_release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: publish_release_assets
      artifacts: true
  script:
    - echo "Creating GitLab Release for ${CI_COMMIT_TAG}"
  release:
    tag_name: '$CI_COMMIT_TAG'
    name: 'Release $CI_COMMIT_TAG'
    description: |
      Automated release for $CI_COMMIT_TAG.

      Changelog: CHANGELOG.md
    assets:
      links:
        - name: 'Alpine x86_64 package ($RELEASE_ASSET_ALPINE_NAME)'
          url: '$RELEASE_ASSET_ALPINE_URL'
          link_type: package
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
      when: on_success
    - when: never
