app-id: org.dosierskanilo.DosierSkaniloGui
runtime: org.gnome.Platform
runtime-version: '46'
sdk: org.gnome.Sdk
command: dosierskanilo-gui
finish-args:
  - --filesystem=home
  - --socket=fallback-x11
  - --socket=wayland
  - --share=ipc
# GTK3/GStreamer come from the GNOME runtime. Optional MediaInfo, codec packs,
# file, and archive tools are not bundled by this draft.
modules:
  - name: dosierskanilo-gui
    buildsystem: simple
    build-commands:
      - install -Dm755 build/bin/dosierskanilo-gui /app/bin/dosierskanilo-gui
      - install -Dm644 LICENSE.md /app/share/licenses/org.dosierskanilo.DosierSkaniloGui/LICENSE.md
    sources:
      - type: archive
        url: https://gitlab.vahanus.net/dlang/dosierskanilo-gui/-/archive/v0.12.1/dosierskanilo-gui-v0.12.1.tar.gz
        sha256: 33873999482a1dd9dca6a2c37d200129a18b700f763c1a55fe6e20334e75a1fd
