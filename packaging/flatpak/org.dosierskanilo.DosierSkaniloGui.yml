app-id: org.dosierskanilo.DosierSkaniloGui
runtime: org.gnome.Platform
runtime-version: '46'
sdk: org.gnome.Sdk
command: dosierskanilo-gui
finish-args:
  - --filesystem=home
  - --socket=fallback-x11
  - --socket=wayland
  - --share=ipc
modules:
  - name: dosierskanilo-gui
    buildsystem: simple
    build-commands:
      - install -Dm755 build/bin/dosierskanilo-gui /app/bin/dosierskanilo-gui
      - install -Dm644 LICENSE.md /app/share/licenses/org.dosierskanilo.DosierSkaniloGui/LICENSE.md
    sources:
      - type: archive
        url: https://gitlab.vahanus.net/dlang/dosierskanilo-gui/-/archive/v0.11.0/dosierskanilo-gui-v0.11.0.tar.gz
        sha256: 7d92da3a97f60304b6c87f251a43ae86d5ce4bf581f6a91ac343439d270bef64
