app-id: org.dosierskanilo.DosierSkaniloGui
runtime: org.gnome.Platform
runtime-version: '46'
sdk: org.gnome.Sdk
command: dosierskanilo-gui
finish-args:
  - --filesystem=home
  - --socket=fallback-x11
  - --socket=wayland
  - --share=ipc
modules:
  - name: dosierskanilo-gui
    buildsystem: simple
    build-commands:
      - install -Dm755 build/bin/dosierskanilo-gui /app/bin/dosierskanilo-gui
      - install -Dm644 LICENSE.md /app/share/licenses/org.dosierskanilo.DosierSkaniloGui/LICENSE.md
    sources:
      - type: archive
        url: https://gitlab.vahanus.net/dlang/dosierskanilo-gui/-/archive/v0.12.0/dosierskanilo-gui-v0.12.0.tar.gz
        sha256: 63f8d61baf8fc28271cd2e1f00e71bff7f5a69b6fdd9768801ae14d7cda5e017
