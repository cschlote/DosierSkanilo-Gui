app-id: org.dosierskanilo.DosierSkaniloGui
runtime: org.gnome.Platform
runtime-version: '46'
sdk: org.gnome.Sdk
command: dosierskanilo-gui
finish-args:
  - --filesystem=home
  - --socket=fallback-x11
  - --socket=wayland
  - --share=ipc
modules:
  - name: dosierskanilo-gui
    buildsystem: simple
    build-commands:
      - install -Dm755 build/bin/dosierskanilo-gui /app/bin/dosierskanilo-gui
    sources:
      - type: archive
        url: https://github.com/cschlote/DosierSkanilo-Gui/archive/refs/tags/v0.6.0.tar.gz
        sha256: REPLACE_WITH_RELEASE_ARCHIVE_HASH
